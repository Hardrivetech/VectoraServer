# Vectora runtime config
# Format: key=value
# Boolean values: true/false, yes/no, on/off, 1/0

# TCP listen port.
port=25565

# Player counts shown to clients.
max_players=20

# Maximum concurrent connections (per-client worker threads). Prevents resource exhaustion.
max_connections=100

# Player count mode for server list ping: fixed, zero, connected.
online_players_mode=connected

# Player count shown as currently online in the server list ping.
online_players_display=0

# Version block shown in the multiplayer server list. Keep this aligned with protocol_number.
# Current mapping used by this server: Minecraft 1.21.11 -> protocol 774.
protocol_name=Vectora 1.21.11
protocol_number=774

# Login-state compression threshold. 0 compresses all packets after Set Compression.
compression_threshold=256

# Chunk stream radius in chunk units around center.
# 0 = auto derive from view_distance (clamped), otherwise explicit radius.
chunk_stream_radius=0

# Brand string sent to the Minecraft client.
server_brand=Vectora

# Server list message shown in the multiplayer screen.
motd=Welcome to Vectora! 

# Authentication mode: offline = client username hash, online = Mojang/Microsoft validation
# offline_mode creates deterministic UUIDs from usernames (no login validation needed)
offline_mode=true

# Optional explicit world folder path. Leave blank to use automatic discovery.
# world_path=C:/path/to/your/world

# Distances announced in Join Game.
view_distance=10
simulation_distance=10

# Game mode: 0=Survival, 1=Creative, 2=Adventure, 3=Spectator
game_mode=0

# Difficulty: 0=Peaceful, 1=Easy, 2=Normal, 3=Hard
difficulty=2

# Hardcore mode: true/false (player dies permanently, difficulty must be Hard)
is_hardcore=false

# PvP enabled: true/false (allows player-vs-player combat)
pvp_enabled=true

# Spawn protection radius: blocks around spawn where players cannot break/place blocks (0 = disabled)
spawn_protection_radius=16

# Game Rules
# doDaylightCycle: true/false - controls day/night cycle
rule_do_daylight_cycle=true

# doMobSpawning: true/false - controls mob spawning
rule_do_mob_spawning=true

# doFireTick: true/false - controls fire spread
rule_do_fire_tick=true

# doEnvironmentDamage: true/false - allows fall/drowning damage
rule_do_environment_damage=true

# keepInventory: true/false - keep items on death
rule_keep_inventory=false

# doImmediateRespawn: true/false - skip respawn screen
rule_do_immediate_respawn=false

# showDeathMessages: true/false - broadcast death messages
rule_show_death_messages=true

# sendCommandFeedback: true/false - command feedback
rule_send_command_feedback=true

# logAdminCommands: true/false - log admin commands
rule_log_admin_commands=true

# announceAdvancements: true/false - announce advancements
rule_announce_advancements=true

# disableElytraMovementCheck: true/false - disable elytra check
rule_disable_elytra_movement_check=false

# maxCommandChainLength: integer (0-2147483647) - max command chain length
rule_max_command_chain_length=65536

# maxEntityCramming: integer (0-1000) - max entities per block
rule_max_entity_cramming=24

# randomTickSpeed: integer (0-1000) - random tick speed (3 is default)
rule_random_tick_speed=3

# Force debug chunks and debug spawn even when real world data is available.
force_debug_spawn=false

# Enable loading real chunks from the world folder.
enable_real_chunks=true

# Fall back to generated debug chunks when a real chunk cannot be loaded.
allow_debug_chunk_fallback=true

# Send the minecraft:brand packet with the configured server brand string.
send_brand_packet=true

# Send the Game Rules packet during play bootstrap.
# This is only attempted when the connecting client protocol matches protocol_number above.
# Leave this off until the packet is validated for your target protocol.
send_game_rules_packet=true

# Send Game Event 13 to move the client out of the loading terrain state.
send_wait_for_level_chunks_event=true

# Reject login attempts from clients whose handshake protocol does not match protocol_number.
reject_protocol_mismatch=true

# Packet framing logs are very noisy. Keep this off unless you are debugging protocol framing.
log_packet_framing=false

# Log each decoded play packet ID from the client.
log_play_packets=false

# Log each chunk that is sent to the client.
log_chunk_sends=false